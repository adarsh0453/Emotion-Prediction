<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moodline — read the emotion in your words</title>
<meta name="description" content="Type a sentence and watch a BiGRU model read the emotion inside it.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,380;0,9..144,560;1,9..144,460;1,9..144,560&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="grain"></div>
<div class="field"></div>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" id="statusDot" title="checking server..."></span>
      <span class="brand-name">Moodline</span>
    </div>
    <p class="status-line" id="serverStatusText">connecting to model…</p>
  </header>

  <main>

    <section class="hero">
      <h1 class="hero-line">Say something.<br>See what it's carrying.</h1>
      <p class="hero-sub">A small BiGRU model reads six emotions out of a single sentence — sadness, joy, love, anger, fear, surprise.</p>
    </section>

    <section class="console" id="console">

      <div class="orb-stage">
        <div class="orb-ring"></div>
        <div class="orb-glow" id="orbGlow"></div>
        <div class="orb" id="orb">
          <span class="orb-emoji" id="orbEmoji">✎</span>
        </div>
      </div>

      <div class="input-panel">
        <textarea
          id="textInput"
          maxlength="2000"
          placeholder="Write a sentence and let it speak for itself — e.g. “I can't believe we actually pulled this off.”"
        ></textarea>

        <div class="input-footer">
          <span class="char-count"><span id="charCount">0</span> / 2000</span>
          <button id="analyzeBtn" class="btn-primary" disabled>
            <span class="btn-label">Read the mood</span>
          </button>
        </div>

        <p class="error-msg" id="errorMsg" hidden></p>
      </div>

    </section>

    <section class="result" id="resultSection" hidden>

      <div class="reveal">
        <span class="reveal-mark" aria-hidden="true">“</span>
        <div class="reveal-main">
          <span class="reveal-emoji" id="emotionEmoji">😄</span>
          <h2 id="emotionWord">Joy</h2>
        </div>
        <span class="confidence-mono" id="confidenceText">92.4% confidence</span>
        <blockquote class="echoed-text" id="echoedText"></blockquote>
      </div>

      <div class="breakdown">
        <div class="bars" id="barsContainer"></div>
      </div>

    </section>

  </main>

  <footer class="footbar">
    <span class="footbar-hint">⌘ / Ctrl + Enter to analyze</span>
    <span class="footbar-credit">Moodline — a mood-reading instrument</span>
  </footer>

</div>

<script src="/static/script.js"></script>
</body>
</html>
